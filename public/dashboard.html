        //

      if(!tr) return;
      const ref = tr.dataset.ref;
      if(btn.classList.contains('action-btn')){
        updateRequestStatusOnServer(ref, btn.dataset.status);
      }else if(btn.classList.contains('apply-status')){

        //
        // This function is called by the "Logout" button in the

        // ============================================================
    function logout() {
    localStorage.removeItem('adminToken');

}

          window.location.href = 'admin.html';
          //loginSection.style.display = 'flex';
          //board.style.display = 'none';
          return;
        }
        if (!response.ok) throw new Error('Failed to update note');
        return response.json();
      })
      .then((data) => {
        if (data) { loadEntriesFromServer();
        alert('Note Updated!');
        }
      })
      .catch(error => console.error('Note update error:', error));
    }

    // Remove a request by ref, persist the updated list, and re-render.
    function deleteRequest(ref, reason){
       const entry = entries.find(x => x.ref === ref);
       if(!entry) return false;
       entry.status = 'removed';
       entry.note = reason;
       renderAdminTable();
       return true;
    }

    // Event delegation: handle clicks for quick-action buttons, apply buttons, and delete button.

    // ============================================================
// HOW dataset WORKS [addEventListener]
// ============================================================
//
// The browser automatically creates a `dataset` property on
// every HTML element. It reads all `data-*` attributes and
// puts them on that object. You don't create it — the browser gives it to you.
//
// RULE: strip "data-" from the HTML attribute name → that's the JS property.
//
//   HTML attribute          JS access
//   ──────────────          ──────────────
//   data-ref="MLY-2026-0233"  →  element.dataset.ref
//   data-status="released"    →  element.dataset.status
//   data-note="hello"         →  element.dataset.note
//
// EXAMPLE FLOW:
//
//   1. renderAdminTable() builds HTML as a string:
//      tbody.innerHTML = `
//        <tr data-ref="MLY-2026-0233">
//          <button class="action-btn" data-status="released">Release</button>
//        </tr>
//      `
//
//   2. The browser parses that string and creates real DOM elements.
//
//   3. User clicks "Release" → your click listener catches it:
//      - btn.closest('tr')  → finds the <tr> that contains the button
//      - tr.dataset.ref     → reads "MLY-2026-0233" from the row
//      - btn.dataset.status → reads "released" from the button
//
//   4. You now know WHICH entry and WHAT action → send to server.
// ============================================================

    tbody.addEventListener('click', (evt) => {
      const btn = evt.target.closest('button');
      if(!btn) return;
      const tr = btn.closest('tr');
      if(!tr) return;
      const ref = tr.dataset.ref;
      if(btn.classList.contains('action-btn')){
        updateRequestStatusOnServer(ref, btn.dataset.status);
      }else if(btn.classList.contains('apply-status')){
        const select = tr.querySelector('.status-select');
        if(select){
          updateRequestStatusOnServer(ref, select.value);
        }
      }else if(btn.classList.contains('delete-btn')){
        const reason = prompt(`Why are you removing request ${ref}? This will be shown to the requester.`);
        if(reason === null) return;
        if(reason.trim() === ''){
          alert('Please enter a reason before removing.');
          return;
        }
        deleteRequest(ref, reason.trim());
        updateRequestStatusOnServer(ref, 'removed', reason.trim());
      }
      }); 

    // Event delegation for the removed records table — handles Save Note clicks
    removedTbody.addEventListener('click', (evt) => {
      const btn = evt.target.closest('.save-note-btn');
      if (!btn) return;
      const ref = btn.dataset.ref;
      const input = removedTbody.querySelector(`.note-input[data-ref="${ref}"]`);
      if (!input) return;
      const newNote = input.value;
      updateNoteOnServer(ref, newNote);
    });
    loadEntriesFromServer();
